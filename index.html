<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physio Calculator</title>

    <style>
        :root {
            --ink: #17323a;
            --muted: #62777e;
            --line: #d5e2e3;
            --bg: #eef4f4;

            --accent: #1f7a7a;
            --accent-dark: #17595c;

            --below: #e07a6f;
            --low: #f0b94d;
            --norm: #5fb48c;
            --above: #4a8fc4;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--ink);
            padding: 15px;
            margin: 0;
            line-height: 1.45;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--surface);
            padding: 28px;
            border-radius: 14px;
            border: 1px solid var(--line);
        }

        h1 { text-align: center; font-size: 2rem; font-weight: 700; margin: 0 0 4px 0; letter-spacing: -0.01em; }
        .subtitle { text-align: center; color: var(--muted); margin-bottom: 26px; font-size: 1rem; }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 24px 0 14px 0;
            padding-left: 12px;
            border-left: 4px solid var(--accent);
        }

        label { font-weight: 500; font-size: 0.95rem; display: block; margin-bottom: 5px; }
